<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAL - Modern Yaşam ve Sohbet Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s, color 0.3s;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 5px;
        }
        header p {
            color: var(--text-muted);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }
        /* Sohbet Alanı */
        .chat-box {
            flex: 1;
            background: var(--bg-color);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .message.bot {
            background: #334155;
            align-self: flex-start;
            color: var(--text-color);
        }
        .message.user {
            background: var(--primary);
            align-self: flex-end;
            color: white;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }
        .chat-input-area button {
            padding: 0 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .chat-input-area button:hover {
            background: var(--primary-hover);
        }
        /* Faydalı Araçlar ve Görsel Alanı */
        .tools-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .tool-item {
            background: var(--bg-color);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
        }
        .gallery-preview {
            flex: 1;
            background: var(--bg-color);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .gallery-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DAL Portalı</h1>
            <p>Bilgi, Görsel ve Sohbet Dünyasına Hoş Geldiniz</p>
        </header>

        <div class="grid">
            <!-- Sol Kart: Canlı Sohbet Asistanı -->
            <div class="card">
                <h2><i class="fa-solid fa-comments"></i> DAL Asistan Sohbeti</h2>
                <div class="chat-box" id="chatBox">
                    <div class="message bot">Merhaba! Ben DAL Asistan. Size nasıl yardımcı olabilirim?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Bir şeyler yazın..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Sağ Kart: Günün Görseli ve Faydalı Bilgiler -->
            <div class="card">
                <h2><i class="fa-solid fa-compass"></i> Keşfet & Faydalı Araçlar</h2>
                <div class="tools-content">
                    <div class="tool-item">
                        <i class="fa-solid fa-lightbulb" style="color: #fbbf24;"></i> <strong>Günün Sözü:</strong> "Başlamak için harika bir gün!"
                    </div>
                    <div class="gallery-preview">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" alt="Sanatsal Görsel">
                        <div class="gallery-text">DAL İlham Panosu - Modern Tasarım</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            
            if (text === '') return;

            // Kullanıcı mesajı
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Bot yanıtı simülasyonu
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.nodeValue = '';
                
                if (text.toLowerCase().includes('merhaba') || text.toLowerCase().includes('selam')) {
                    botMsg.textContent = "Merhaba! DAL portalına hoş geldin, bugün senin için ne yapabilirim?";
                } else if (text.toLowerCase().includes('nasılsın')) {
                    botMsg.textContent = "Çok teşekkürler, harikayım! Sen nasılsın?";
                } else {
                    botMsg.textContent = `"${text}" dedin. DAL portalı üzerinden bu harika fikirleri keşfetmeye devam edebilirsin!`;
                }
                
                chatBox.appendChild(botMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
